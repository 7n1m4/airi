    memory:
      blurb: 'Кратковременная и долговременная память, журналы и retrieval для компаньона.'
      reason: 'Готов в Slint — маршруты берёт навигация настроек; бэкенд реализован в airi-core memory (journal, retrieval, embeddings); поверхность настроек приходит в этой волне.'
    speech:
      blurb: 'Голосовой вывод текста для вашего компаньона.'
      reason: 'Готов в Slint — бэкенд реализован в airi-speech (26 определений TTS + Kokoro); поверхность настроек TTS/STT в Slint приходит в этой волне.'
    hearing:
      blurb: 'Вход с микрофона, определение голосовой активности и транскрипция.'
      reason: 'Готов в Slint — бэкенд реализован в airi-stt (capture, Silero VAD, Deepgram/Aliyun/whisper-local); поверхность настроек слуха в Slint приходит в этой волне.'
    vision:
      blurb: 'Визуальное восприятие экрана и камеры.'
      reason: 'Отложен — в Slint нет vision-стека (moondream/blip/apple-core-ai отсутствуют в Rust-реестре); сегодня живёт в приложении Electron.'
    consciousness:
      blurb: 'Личность, рассуждение и базовое поведение модели.'
      reason: 'Отложен — в Slint нет аналога; сегодня живёт в приложении Electron.'
    agenticOs:
      blurb: 'Автономное поведение на основе presence и хуки автоматизации ОС.'
      reason: 'Отложен — в Slint нет бэкенда (presence, companion scopes, event log); сегодня живёт в приложении Electron.'
    textToMotion:
      blurb: 'Процедурная генерация анимации из текста (вывод VRMA).'
      reason: 'Отложен — в Slint нет аналога (FlowMDM / VRMA); смежно с P10; сегодня живёт в приложении Electron.'
    discord:
      blurb: 'Бот Discord: отправка сообщений и наблюдение за шлюзом только-приёма.'
      reason: 'Подключён — REST только-отправка + opt-in шлюз приёма в памяти; без бот-команд; полный путь бот-команд остаётся у Electron.'
    mcp:
      blurb: 'Серверы и наборы инструментов Model Context Protocol.'
      reason: 'Подключён — MCP-клиент (stdio + streamable-HTTP) с конфигурацией mcp.json; Discover пока не подключён.'
