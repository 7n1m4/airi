modules:
  title: '模块'
  overviewBadge: '概览'
  notice: '模块家族的静态概览——本页发布时手动核对的状态；此处没有任何内容是实时的。设置导航提供各页面路由；延期项已禁用。'
  indexNow: '立即索引记忆'
  indexHint: '用已配置的提供商为未索引的日志条目生成向量嵌入——一次批量请求处理所有缺失条目。'

  footer: '延期的模块已禁用。本页不切换、连接或持久化任何内容。'
  sectionChat: '对话与智能'
  sectionIntegrations: '集成'
  sectionRenderers: '渲染器'
  sectionCardAi: 'Card-AI'
  statusReady: '就绪'
  statusExperimental: '实验性'
  statusDeferred: '延期'
  entries:
    memory:
      blurb: '为你的伙伴提供短期与长期记忆、日志与检索。'
      reason: 'Qt 中就绪——路由由设置导航处理；后端已落地 airi-core memory（日志、检索、向量嵌入）；设置界面在本 wave 到达。'
    speech:
      blurb: '为你的伙伴提供文本转语音输出。'
      reason: 'Qt 中就绪——后端已落地 airi-speech（26 个 TTS 定义 + Kokoro）；Qt TTS/STT 设置界面在本 wave 到达。'
    hearing:
      blurb: '麦克风输入、语音活动检测与转录。'
      reason: 'Qt 中就绪——后端已落地 airi-stt（采集、Silero VAD、Deepgram/Aliyun/whisper-local）；Qt 听觉设置界面在本 wave 到达。'
    vision:
      blurb: '屏幕与摄像头视觉感知。'
      reason: '延期——Qt 无 vision 栈（moondream/blip/apple-core-ai 不在 Rust 注册表中）；目前存在于 Electron 应用。'
    consciousness:
      blurb: '性格、推理与模型基础行为。'
      reason: '延期——Qt 无对应实现；目前存在于 Electron 应用。'
    agenticOs:
      blurb: '基于 presence 的自主行为与 OS 自动化钩子。'
      reason: '延期——Qt 无后端（presence、companion scopes、event log）；目前存在于 Electron 应用。'
    textToMotion:
      blurb: '从文本生成程序化动画（VRMA 输出）。'
      reason: '延期——Qt 无对应实现（FlowMDM / VRMA）；与 P10 相邻；目前存在于 Electron 应用。'
    discord:
      blurb: 'Discord 机器人：发送消息并观察只读接收网关。'
      reason: '已接线——仅发送 REST + 可选加入的内存内只读接收网关；无 bot 命令；完整 bot 命令路径归 Electron。'
    mcp:
      blurb: 'Model Context Protocol 服务器与工具集。'
      reason: '已接线——MCP 客户端（stdio + streamable-HTTP），由 mcp.json 配置；Discover 尚未接线。'
    acp:
      blurb: '带 HITL 权限的 Agent Client Protocol 会话。'
      reason: '已接线——ACP 桥；HITL 权限提示在 Qt 中可用。'
    cloudSync:
      blurb: '备份快照到你自己的存储（BYOS）。'
      reason: '已接线——本地文件夹目标、快照验证/恢复；S3/mesh/选择性同步未接线。'
    pluginHost:
      blurb: 'AIRI 插件包的主机。'
      reason: '仅脚手架——无发现/启用/capability 总线；Qt v1 豁免；插件由 Electron 主进程托管。'
    vrm:
      blurb: 'VRM 模型渲染与舞台场景。'
      reason: 'Qt 中就绪——VRM 舞台渲染（VrmMtoonMaterial + 舞台场景）；已通过 smoke 验证。'
    spine:
      blurb: 'Spine 2D 骨骼动画模型。'
      reason: 'Qt 中就绪——SpineStage + SpineSettingsPage；已通过 smoke 验证。'
    mmd:
      blurb: 'MikuMikuDance 模型（.pmx/.pmd）。'
      reason: '实验性——仅用合成 fixture 验证了绑定姿势；未运行过有许可的真实 .pmx。'
    live2d:
      blurb: 'Live2D Cubism 模型。'
      reason: '延期——许可；Qt 无 Cubism 运行时；Live2D 由 Electron 渲染。'
    cardAiStudio:
      blurb: 'AI 辅助的角色卡创建工作室。'
      reason: '延期——Qt v1 豁免，计划 v1.1；目前存在于 Electron 应用。'
memory:
  title: '记忆'
