      hearing:
        title: Voice Transcription (STT)
        description: Transcribe speech to text using cloud or local engines.
      speech:
        title: Neural Voice (TTS)
        description: High-quality voice synthesis with multiple providers.
      thinking:
        title: Conversational Pacing
        description: Natural pauses, fillers, and subconscious asides.
      emotions:
        title: ACT Expression Bridge
        description: Map dialogue emotions to avatar facial expressions.
      vision:
        title: Chat Photo Understanding
