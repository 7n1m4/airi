      speech:
        title: Speech
        description: Give your companion a voice with neural TTS.
      thinking:
        title: Thinking
        description: Natural conversational pacing and subconscious asides.
      emotions:
        title: Emotions
        description: 2-pass ACT expression bridge for avatar emoting.
      vision:
        title: Vision
        description: Understand images sent in chat via VLM.
      screen:
        title: Screen
        description: Desktop perception and OCR for contextual awareness.
      proactivity:
        title: Proactivity
        description: Ambient heartbeats, sleep schedule, and check-ins.
      artistry:
        title: Artistry
        description: Image generation via Pollinations, ComfyUI, or Replicate.
      memory:
        title: Memory
        description: 4-quadrant cognitive memory hierarchy.
      tools:
        title: Tools
        description: Web search, desktop MCP, and generative motion.
