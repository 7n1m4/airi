modules:
  title: 'Modul'
  overviewBadge: 'Ringkasan'
  notice: 'Ringkasan statis keluarga modul — status diverifikasi manual saat halaman ini mendarat; tidak ada yang live di sini. Navigasi pengaturan menyediakan rutenya; entri yang ditunda dinonaktifkan.'
  indexNow: 'Indeks memori sekarang'
  indexHint: 'Sematkan entri jurnal yang belum terindeks dengan penyedia yang dikonfigurasi — satu permintaan batch untuk semua entri yang hilang.'

  footer: 'Modul yang ditunda dinonaktifkan. Halaman ini tidak mengaktifkan, menghubungkan, atau menyimpan apa pun.'
  sectionChat: 'Chat & Kecerdasan'
  sectionIntegrations: 'Integrasi'
  sectionRenderers: 'Render'
  sectionCardAi: 'Card-AI'
  statusReady: 'Siap'
  statusExperimental: 'Eksperimental'
  statusDeferred: 'Ditunda'
  entries:
    memory:
      blurb: 'Memori jangka pendek & panjang, jurnal dan retrieval untuk companion-mu.'
      reason: 'Siap di Qt — rute dikelola navigasi pengaturan; backend mendarat di airi-core memory (journal, retrieval, embeddings); permukaan pengaturan tiba di wave ini.'
    speech:
      blurb: 'Keluaran suara text-to-speech untuk companion-mu.'
      reason: 'Siap di Qt — backend mendarat di airi-speech (26 definisi TTS + Kokoro); permukaan pengaturan TTS/STT Qt tiba di wave ini.'
    hearing:
      blurb: 'Input mikrofon, deteksi aktivitas suara dan transkripsi.'
      reason: 'Siap di Qt — backend mendarat di airi-stt (capture, Silero VAD, Deepgram/Aliyun/whisper-local); permukaan pengaturan pendengaran Qt tiba di wave ini.'
    vision:
      blurb: 'Persepsi visual layar dan kamera.'
      reason: 'Ditunda — tanpa stack vision di Qt (moondream/blip/apple-core-ai tidak ada di registri Rust); hidup di aplikasi Electron hari ini.'
    consciousness:
      blurb: 'Kepribadian, penalaran dan perilaku dasar model.'
      reason: 'Ditunda — tanpa padanan Qt; hidup di aplikasi Electron hari ini.'
    agenticOs:
      blurb: 'Perilaku otonom berbasis presence dan hook otomasi OS.'
      reason: 'Ditunda — tanpa backend Qt (presence, companion scopes, event log); hidup di aplikasi Electron hari ini.'
    textToMotion:
      blurb: 'Generasi animasi prosedural dari teks (keluaran VRMA).'
      reason: 'Ditunda — tanpa padanan Qt (FlowMDM / VRMA); berdekatan dengan P10; hidup di aplikasi Electron hari ini.'
    discord:
      blurb: 'Bot Discord: kirim pesan dan lihat gateway khusus terima.'
      reason: 'Tersambung — REST kirim-saja + gateway terima opt-in di memori; tanpa perintah bot; Electron mempertahankan jalur perintah bot penuh.'
    mcp:
      blurb: 'Server dan toolset Model Context Protocol.'
      reason: 'Tersambung — klien MCP (stdio + streamable-HTTP) dengan konfigurasi mcp.json; Discover belum disambungkan.'
    acp:
      blurb: 'Sesi Agent Client Protocol dengan izin HITL.'
      reason: 'Tersambung — jembatan ACP dengan prompt izin HITL fungsional di Qt.'
    cloudSync:
      blurb: 'Cadangkan snapshot ke penyimpananmu sendiri (BYOS).'
      reason: 'Tersambung — target folder lokal, verifikasi/restore snapshot; S3/mesh/selektif belum disambungkan.'
    pluginHost:
      blurb: 'Host untuk paket plugin AIRI.'
      reason: 'Hanya scaffold — tanpa penemuan/pengaktifan/bus kapabilitas; dibebaskan untuk Qt v1; main process Electron yang meng-host plugin.'
    vrm:
      blurb: 'Render model VRM dan scene stage.'
      reason: 'Siap di Qt — stage VRM me-render (VrmMtoonMaterial + scene); terverifikasi smoke.'
    spine:
      blurb: 'Model animasi skeletal 2D Spine.'
      reason: 'Siap di Qt — SpineStage + SpineSettingsPage; terverifikasi smoke.'
    mmd:
      blurb: 'Model MikuMikuDance (.pmx/.pmd).'
      reason: 'Eksperimental — rest pose terverifikasi dengan fixture sintetis saja; tidak ada .pmx asli berlisensi yang pernah diuji.'
    live2d:
      blurb: 'Model Live2D Cubism.'
      reason: 'Ditunda — lisensi; tanpa runtime Cubism di Qt; Electron me-render Live2D.'
    cardAiStudio:
      blurb: 'Studio pembuatan character card berbantuan AI.'
      reason: 'Ditunda — dibebaskan untuk Qt v1, dijadwalkan v1.1; hidup di aplikasi Electron hari ini.'
