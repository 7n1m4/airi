  experience:
    label: Experiencia
    subtitle: Arquetipo de interacción
    title: Arquetipos de interacción
    description: Selecciona un estilo preconfigurado de interacción. Esto ajustará
      los módulos activos y eliminará los pasos innecesarios.
    archetypes:
      quietObserver:
        title: Observador Silencioso
        tag: El más rápido · Minimalista
        description: Compañero de texto ultraligero. El avatar reacciona en el
          escenario, tiene pensamientos y memoria a largo plazo, con cero
          consumo de audio o visión.
      casualCompanion:
        title: Compañero Cotidiano
        tag: Opción más popular
        description: El compañero ideal de voz y presencia visual. Diálogo natural
          (STT/TTS), análisis de fotos del chat (VLM), pausas realistas y
          memoria a largo plazo.
      creativeMuse:
        title: Musa Creativa
        tag: Enfoque visual y artístico
        description: Tu estudio de inspiración visual. Voz hablada, generación autónoma
          de imágenes (Pollinations/ComfyUI), comprensión de fotos y ricas
          expresiones.
      executiveCopilot:
        title: Copiloto Ejecutivo
        tag: Máxima productividad
        description: Diseñado para el trabajo productivo. Diálogo por voz, percepción de
          ventanas en el escritorio, herramientas MCP locales y búsqueda web en
          vivo.
      ambientRoommate:
        title: Compañero de Cuarto
        tag: Presencia proactiva
        description: Rutina viva y presencia constante. Voz hablada, comentarios
          espontáneos por latidos ambientales, horario de sueño y observación de
          pantalla.
      swissArmy:
        title: Navaja Suiza (Todo en Uno)
        tag: Todos los pasos · Completo
        description: 'La experiencia insignia integral: audio bidireccional, análisis
          visual, observación de pantalla, proactividad, arte, herramientas
          externas y memoria en 4 cuadrantes.'
      quiet:
        title: El Observador Silencioso
        badge: ⚡ Más Rápido · Minimalista
        subtitle: Texto, Expresiones y Memoria
        description: Cero sobrecarga de audio, emociones de avatar, pausas reflexivas y
          memoria a largo plazo.
      casual:
        title: El Compañero Casual
        badge: ✨ Elección Popular
        subtitle: Diálogo de Voz y Visión
        description: Transcripción de voz en vivo (STT), voz emocional (TTS), visión de
          fotos, ritmo natural y memoria.
      muse:
        title: La Musa Creativa
        badge: 🎨 Enfoque Visual
        subtitle: Voz, Visión y Arte
        description: Diálogo hablado, generación de imágenes (Pollinations/ComfyUI),
          visión de chat y morfologías expresivas.
      copilot:
        title: El Copiloto Ejecutivo
        badge: 💼 Productividad
        subtitle: Voz + Herramientas de Acción
        description: Diálogo de voz, observación de pantalla de escritorio, herramientas
          MCP locales y búsqueda web en vivo.
      roommate:
        title: El Compañero de Cuarto
        badge: 🌙 Presencia Proactiva
        subtitle: Rutina Viva y Presencia
        description: Voz hablada, latidos ambientales, horario de sueño, horas
          silenciosas y percepción de pantalla.
      swiss-army:
        title: El Compañero Navaja Suiza
        badge: 🔥 Más Pasos · Todo en Uno
        subtitle: Multimodal Autónomo Completo
        description: El compañero definitivo todo en uno. Audición, voz neural, pausas
          reflexivas, emociones ACT de 2 pasos, observación de pantalla, arte y
          memoria cognitiva.
    advanced:
      toggle: 'Avanzado: Personalizar módulos individuales'
      description: Activa o desactiva manualmente módulos sensoriales y cognitivos
        específicos.
      modules:
        hearing: Audición (Transcripción por micrófono)
