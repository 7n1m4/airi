modules:
  title: 'Modules'
  overviewBadge: 'Vue d’ensemble'
  notice: 'Vue d’ensemble statique de la famille de modules — statuts vérifiés à la main lorsque cette page a été livrée ; rien ici n’est en direct. La navigation des réglages fournit les routes ; les entrées différées sont désactivées.'
  indexNow: 'Indexer les mémoires maintenant'
  indexHint: 'Embarque les entrées de journal non indexées avec votre fournisseur configuré — une requête par lot pour toutes les entrées manquantes.'

  footer: 'Les modules différés sont désactivés. Cette page n’active, ne connecte ni ne persiste rien.'
  sectionChat: 'Chat & Intelligence'
  sectionIntegrations: 'Intégrations'
  sectionRenderers: 'Rendus'
  sectionCardAi: 'Card-AI'
  statusReady: 'Prêt'
  statusExperimental: 'Expérimental'
  statusDeferred: 'Différé'
  entries:
    memory:
      blurb: 'Mémoire à court et long terme, journaux et retrieval pour votre compagnon.'
      reason: 'Prêt dans Qt — routes gérées par la navigation des réglages ; backend livré dans airi-core memory (journal, retrieval, embeddings) ; la surface de réglages arrive dans cette wave.'
    speech:
      blurb: 'Sortie vocale texte-parole pour votre compagnon.'
      reason: 'Prêt dans Qt — backend livré dans airi-speech (26 définitions TTS + Kokoro) ; la surface de réglages TTS/STT Qt arrive dans cette wave.'
    hearing:
      blurb: 'Entrée micro, détection d’activité vocale et transcription.'
      reason: 'Prêt dans Qt — backend livré dans airi-stt (capture, Silero VAD, Deepgram/Aliyun/whisper-local) ; la surface de réglages audition Qt arrive dans cette wave.'
    vision:
      blurb: 'Perception visuelle écran et caméra.'
      reason: 'Différé — pas de pile vision en Qt (moondream/blip/apple-core-ai absents du registre Rust) ; vit dans l’app Electron aujourd’hui.'
    consciousness:
      blurb: 'Personnalité, raisonnement et comportement de base du modèle.'
      reason: 'Différé — pas d’équivalent Qt ; vit dans l’app Electron aujourd’hui.'
    agenticOs:
      blurb: 'Comportement autonome guidé par la présence et crochets d’automatisation OS.'
      reason: 'Différé — pas de backend Qt (presence, companion scopes, event log) ; vit dans l’app Electron aujourd’hui.'
    textToMotion:
      blurb: 'Génération procédurale d’animation depuis du texte (sortie VRMA).'
      reason: 'Différé — pas d’équivalent Qt (FlowMDM / VRMA) ; adjacent à P10 ; vit dans l’app Electron aujourd’hui.'
    discord:
      blurb: 'Bot Discord : envoie des messages et regarde une gateway en réception seule.'
      reason: 'Câblé — REST envoi-seul + gateway de réception opt-in en mémoire ; pas de commandes bot ; Electron garde la voie complète des commandes bot.'
    mcp:
      blurb: 'Serveurs et jeux d’outils Model Context Protocol.'
      reason: 'Câblé — client MCP (stdio + streamable-HTTP) configuré par mcp.json ; Discover pas encore câblé.'
    acp:
      blurb: 'Sessions Agent Client Protocol avec permissions HITL.'
      reason: 'Câblé — pont ACP avec invites de permission HITL fonctionnelles en Qt.'
    cloudSync:
      blurb: 'Sauvegarde des snapshots vers votre propre stockage (BYOS).'
      reason: 'Câblé — cible dossier local, vérification/restauration de snapshots ; S3/mesh/selectif pas encore câblés.'
    pluginHost:
      blurb: 'Hôte pour les paquets de plugins AIRI.'
      reason: 'Scaffold uniquement — pas de découverte/activation/bus de capacités ; dispensé pour Qt v1 ; le processus principal Electron héberge les plugins.'
    vrm:
      blurb: 'Rendu de modèles VRM et scène du stage.'
      reason: 'Prêt dans Qt — le stage VRM rend (VrmMtoonMaterial + scène) ; vérifié par smoke.'
    spine:
      blurb: 'Modèles d’animation squelettique 2D Spine.'
      reason: 'Prêt dans Qt — SpineStage + SpineSettingsPage ; vérifié par smoke.'
    mmd:
      blurb: 'Modèles MikuMikuDance (.pmx/.pmd).'
      reason: 'Expérimental — rest pose vérifié sur fixtures synthétiques uniquement ; aucun .pmx réel sous licence n’a été exercé.'
    live2d:
      blurb: 'Modèles Live2D Cubism.'
      reason: 'Différé — licence ; pas de runtime Cubism en Qt ; Electron rend Live2D.'
    cardAiStudio:
      blurb: 'Studio de création de character cards assistée par IA.'
      reason: 'Différé — dispensé pour Qt v1, prévu pour la v1.1 ; vit dans l’app Electron aujourd’hui.'
memory:
  title: 'Mémoire'
  badge: 'Info'
  infoTip: 'La mémoire augmente le contexte du chat : les tours complétés sont journalisés, et les tours pertinents peuvent être injectés dans le prompt. Les résumés quotidiens court terme ne sont pas câblés.'
  description: 'Résumés quotidiens court terme et journal texte long terme. La mémoire augmente le contexte du chat — rien ne quitte la machine sauf vers le fournisseur LLM configuré.'
  experimentalNotice: 'La mémoire est expérimentale. Lorsqu’elle est activée, chaque tour de chat complété est journalisé et les tours pertinents peuvent être injectés dans le contexte du chat. Seul votre fournisseur LLM configuré reçoit les données.'
  enable:
    title: 'Activer la mémoire'
    description: 'Journalisez les tours de chat complétés et injectez les mémoires récupérées dans le contexte du chat. Prend effet dès le prochain message.'
    disabledCaption: 'La mémoire est désactivée — les contrôles de retrieval ci-dessous sont désactivés jusqu’à ce que vous l’activiez.'
  shortTerm:
    title: 'Court terme & retrieval'
    badge: 'Câblé'
    note: 'topK borne le nombre de mémoires récupérées injectées par prompt (1–20). Le classement retrieval combine similarité sémantique (poids 0.75) et chevauchement lexical (poids 0.25) dans airi-core ; le pipeline de chat le consomme tant que la mémoire est activée.'
  topK:
    label: 'Retrieval top-k'
    description: 'Combien de mémoires le retrieval peut injecter par prompt (1–20).'
    disabledTip: 'Activez la mémoire pour changer le budget de retrieval.'
  provider:
    label: 'Fournisseur de retrieval'
    notConfigured: 'non configuré'
  journal:
