modules:
  title: '모듈'
  overviewBadge: '개요'
  notice: '모듈 제품군의 정적 개요 — 이 페이지가 출시된 시점에 수동으로 검증된 상태입니다. 실시간 표시는 없습니다. 설정 내비가 각 페이지의 경로를 제공하며, 연기된 항목은 비활성화됩니다.'
  indexNow: '지금 메모리 색인하기'
  indexHint: '색인되지 않은 저널 항목을 설정한 제공자로 임베딩합니다 — 누락된 모든 항목을 하나의 배치 요청으로 처리합니다.'

  footer: '연기된 모듈은 비활성화됩니다. 이 페이지는 아무것도 토글하거나 연결하거나 저장하지 않습니다.'
  sectionChat: '채팅 & 지능'
  sectionIntegrations: '연동'
  sectionRenderers: '렌더러'
  sectionCardAi: 'Card-AI'
  statusReady: '사용 가능'
  statusExperimental: '실험적'
  statusDeferred: '연기됨'
  entries:
    memory:
      blurb: '동반자의 단기·장기 기억, 저널, retrieval.'
      reason: 'Qt에서 사용 가능 — 경로는 설정 내비가 처리. 백엔드는 airi-core memory(journal, retrieval, embeddings)에 구현됨. 설정 표면은 이번 wave에 도착.'
    speech:
      blurb: '동반자를 위한 텍스트 음성 출력.'
      reason: 'Qt에서 사용 가능 — 백엔드는 airi-speech(TTS 정의 26개 + Kokoro)에 구현됨. Qt TTS/STT 설정 표면은 이번 wave에 도착.'
    hearing:
      blurb: '마이크 입력, 음성 활동 감지, 전사.'
      reason: 'Qt에서 사용 가능 — 백엔드는 airi-stt(capture, Silero VAD, Deepgram/Aliyun/whisper-local)에 구현됨. Qt 청취 설정 표면은 이번 wave에 도착.'
    vision:
      blurb: '화면과 카메라 시각 인식.'
      reason: '연기됨 — Qt vision 스택 없음(moondream/blip/apple-core-ai는 Rust 레지스트리에 없음). 현재 Electron 앱에 존재.'
    consciousness:
      blurb: '성격, 추론, 모델 기본 동작.'
      reason: '연기됨 — Qt 대응 없음. 현재 Electron 앱에 존재.'
    agenticOs:
      blurb: 'presence 기반 자율 동작과 OS 자동화 훅.'
      reason: '연기됨 — Qt 백엔드 없음(presence, companion scopes, event log). 현재 Electron 앱에 존재.'
    textToMotion:
      blurb: '텍스트에서 절차적 애니메이션 생성(VRMA 출력).'
      reason: '연기됨 — Qt 대응 없음(FlowMDM / VRMA). P10 인접. 현재 Electron 앱에 존재.'
    discord:
      blurb: 'Discord 봇: 메시지 전송과 수신 전용 게이트웨이 모니터링.'
      reason: '연결됨 — 전송 전용 REST + 옵트인 메모리 내 수신 전용 게이트웨이. 봇 명령 없음. Electron이 전체 봇 명령 경로를 유지.'
    mcp:
      blurb: 'Model Context Protocol 서버와 도구 모음.'
      reason: '연결됨 — MCP 클라이언트(stdio + streamable-HTTP), mcp.json 구성. Discover 미연결.'
    acp:
      blurb: 'HITL 권한이 있는 Agent Client Protocol 세션.'
      reason: '연결됨 — ACP 브리지. HITL 권한 프롬프트가 Qt에서 동작.'
    cloudSync:
      blurb: '자체 저장소에 스냅샷 백업(BYOS).'
      reason: '연결됨 — 로컬 폴더 타깃, 스냅샷 검증/복원. S3/메시/선택적 동기화 미연결.'
    pluginHost:
      blurb: 'AIRI 플러그인 패키지의 호스트.'
      reason: '스캐폴드만 — discovery/활성화/capability 버스 없음. Qt v1 면제. Electron 메인 프로세스가 플러그인을 호스트.'
    vrm:
      blurb: 'VRM 모델 렌더링과 스테이지 씬.'
      reason: 'Qt에서 사용 가능 — VRM 스테이지 렌더링(VrmMtoonMaterial + 스테이지 씬). smoke 검증됨.'
    spine:
      blurb: 'Spine 2D 스켈레탈 애니메이션 모델.'
      reason: 'Qt에서 사용 가능 — SpineStage + SpineSettingsPage. smoke 검증됨.'
    mmd:
      blurb: 'MikuMikuDance 모델(.pmx/.pmd).'
      reason: '실험적 — 합성 픽스처 rest pose만 검증됨. 라이선스된 실제 .pmx는 아직 구동되지 않음.'
    live2d:
      blurb: 'Live2D Cubism 모델.'
      reason: '연기됨 — 라이선스. Qt용 Cubism 런타임 없음. Electron이 Live2D를 렌더링.'
    cardAiStudio:
      blurb: 'AI 지원 캐릭터 카드 제작 스튜디오.'
      reason: '연기됨 — Qt v1 면제, v1.1 예정. 현재 Electron 앱에 존재.'
