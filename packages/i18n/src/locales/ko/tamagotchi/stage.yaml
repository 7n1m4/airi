    title: Gemini 퀀텀 리프
    intro: 차세대 AI 인터랙션에 오신 것을 환영합니다. 이제 Google Gemini의 강력한 멀티모달 이해 능력으로 캐릭터가 구동됩니다.
    vision-title: 진정한 시각 인지
    vision-description: 이제 화면과 사용자 주변을 직접 볼 수 있습니다. 카메라 아이콘을 눌러 캡처하거나 렌즈를 통해 사물을 보여주세요.
    voice-title: 첨단 음성 인터랙션
    voice-description: 감정 뉘앙스를 담은 고품질 저지연 음성 대화입니다. 사용자의 말투와 톤을 듣고 그에 맞추어 응답합니다.
    memory-title: 맥락 기억
    memory-description: 현재 세션을 정밀하게 기억하여 시간이 지날수록 더욱 깊이 있는 대화를 나눌 수 있습니다.
