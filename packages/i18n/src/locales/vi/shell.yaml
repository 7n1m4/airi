      reason: 'Sẵn sàng trong Qt — tuyến do điều hướng cài đặt lo; backend đã đưa vào airi-core memory (journal, retrieval, embeddings); bề mặt cài đặt đến trong wave này.'
    speech:
      blurb: 'Đầu ra giọng nói text-to-speech cho companion của bạn.'
      reason: 'Sẵn sàng trong Qt — backend đã đưa vào airi-speech (26 định nghĩa TTS + Kokoro); bề mặt cài đặt TTS/STT của Qt đến trong wave này.'
    hearing:
      blurb: 'Đầu vào mic, phát hiện hoạt động giọng nói và chuyển lời thành văn bản.'
      reason: 'Sẵn sàng trong Qt — backend đã đưa vào airi-stt (capture, Silero VAD, Deepgram/Aliyun/whisper-local); bề mặt cài đặt hearing của Qt đến trong wave này.'
    vision:
      blurb: 'Nhận thức thị giác màn hình và camera.'
      reason: 'Hoãn lại — không có vision stack trong Qt (moondream/blip/apple-core-ai không có trong Rust registry); hiện sống trong ứng dụng Electron.'
    consciousness:
      blurb: 'Tính cách, lý luận và hành vi nền của model.'
      reason: 'Hoãn lại — không có đối tác Qt; hiện sống trong ứng dụng Electron.'
    agenticOs:
      blurb: 'Hành vi tự chủ dẫn dắt bởi presence và các hook tự động hóa OS.'
      reason: 'Hoãn lại — không có backend Qt (presence, companion scopes, event log); hiện sống trong ứng dụng Electron.'
    textToMotion:
      blurb: 'Sinh animation thủ tục từ văn bản (đầu ra VRMA).'
      reason: 'Hoãn lại — không có đối tác Qt (FlowMDM / VRMA); kề cận P10; hiện sống trong ứng dụng Electron.'
    discord:
      blurb: 'Bot Discord: gửi tin nhắn và theo dõi gateway chỉ-nhận.'
      reason: 'Đã nối — REST chỉ-gửi + gateway nhận opt-in trong bộ nhớ; không lệnh bot; Electron giữ đường lệnh bot đầy đủ.'
    mcp:
      blurb: 'Máy chủ và bộ công cụ Model Context Protocol.'
      reason: 'Đã nối — client MCP (stdio + streamable-HTTP) với cấu hình mcp.json; Discover chưa được nối.'
    acp:
      blurb: 'Phiên Agent Client Protocol với quyền HITL.'
      reason: 'Đã nối — cầu ACP; lời nhắc quyền HITL hoạt động trên Qt.'
    cloudSync:
      blurb: 'Sao lưu snapshot tới kho lưu trữ của riêng bạn (BYOS).'
      reason: 'Đã nối — mục tiêu thư mục cục bộ, xác minh/khôi phục snapshot; S3/mesh/chọn lọc chưa được nối.'
    pluginHost:
      blurb: 'Host cho gói plugin AIRI.'
      reason: 'Chỉ scaffold — không discovery/bật/tắt/capability bus; miễn trừ cho Qt v1; main process Electron host plugin.'
    vrm:
      blurb: 'Render model VRM và cảnh stage.'
      reason: 'Sẵn sàng trong Qt — stage VRM renders (VrmMtoonMaterial + stage scene); xác minh smoke.'
    spine:
      blurb: 'Model animation xương 2D Spine.'
      reason: 'Sẵn sàng trong Qt — SpineStage + SpineSettingsPage; xác minh smoke.'
    mmd:
      blurb: 'Model MikuMikuDance (.pmx/.pmd).'
      reason: 'Thử nghiệm — rest pose chỉ xác minh bằng fixture tổng hợp; chưa từng chạy .pmx thật có license.'
    live2d:
      blurb: 'Model Live2D Cubism.'
      reason: 'Hoãn lại — license; không runtime Cubism cho Qt; Electron renders Live2D.'
    cardAiStudio:
      blurb: 'Studio tạo character card bằng AI.'
      reason: 'Hoãn lại — miễn trừ cho Qt v1, dự kiến v1.1; hiện sống trong ứng dụng Electron.'
