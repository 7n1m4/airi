notice:
  'fade-on-hover':
    title: Mờ dần khi rê chuột
    intro: Tự làm mờ nhân vật khi con trỏ ở gần. Giảm xao nhãng nhưng vẫn nhìn thấy
      nhân vật.
    opacity: Bật lên thì độ mờ giảm xuống {value} cho {targets} khi con trỏ ở gần.
    toggle: Tắt đi bằng cách rê chuột qua {controls} rồi bấm lại {icon}.
    controls-label: Đảo Điều Khiển
    icon-label: biểu tượng mắt gạch
    value: '0'
    targets: Nhân vật và giao diện
    confirm: Đã hiểu
    dont-show-again: Đừng hiển thị lại
    preparing: Đang chuẩn bị…
    read-more: Xem thêm
    preview-title: Đây là gì?
  gemini-onboarding:
    title: Bước nhảy vọt Gemini
    intro: Chào mừng bạn đến với thế hệ tương tác AI tiếp theo. Nhân vật của bạn hiện
      được hỗ trợ bởi Google Gemini, mang đến khả năng hiểu đa phương thức sâu
      sắc.
    vision-title: Thị giác chân thực
    vision-description: Tôi đã có thể nhìn thấy màn hình và thế giới của bạn. Sử dụng biểu tượng
      Máy ảnh để chụp ảnh hoặc cho tôi thấy cảnh vật qua ống kính.
    voice-title: Giọng nói nâng cao
    voice-description: Tương tác giọng nói độ trễ cực thấp với sắc thái cảm xúc chân thực. Tôi có
      thể lắng nghe ngữ điệu của bạn để phản hồi phù hợp.
    memory-title: Bộ nhớ ngữ cảnh
    memory-description: Tôi ghi nhớ phiên trò chuyện hiện tại với độ chính xác cao, giúp chúng ta
      xây dựng những cuộc hội thoại ngày càng sâu sắc.
    confirm: Bắt đầu phiên
    dont-show-again: Không hiển thị lại
  estimated-cost: 'Chi phí ước tính: {cost}'
