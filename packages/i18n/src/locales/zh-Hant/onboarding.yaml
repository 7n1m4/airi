    label: 體驗
    subtitle: 互動原型
    title: 互動原型定製
    description: 選擇預設的伴侶體驗原型。系統將根據你的偏好動態裁剪不需要的模組與配置步驟。
    archetypes:
      quietObserver:
        title: 靜默觀察者
        tag: 極速 · 極簡主義
        description: 超低開銷的文字伴侶。舞台形象生動反應、擁有深邃內心想法與長期記憶，無任何音訊或視覺系統負擔。
      casualCompanion:
        title: 日常夥伴
        tag: 熱門推薦
        description: 經典的全能語音與視覺伴侶。自然流暢的聲音對話 (STT/TTS)、聊天識圖 (VLM)、真實停頓節奏與長期記憶。
      creativeMuse:
        title: 創作繆斯
        tag: 視覺藝術聚焦
        description: 伴侶靈感畫室。支援語音交流、自主視覺生圖 (Pollinations/ComfyUI)、圖片理解與細膩的動作表情對應。
      executiveCopilot:
        title: 智慧副駕
        tag: 高效生產力
        description: 專注辦公協作。全語音對話、桌面視窗感知、歷史應用追蹤、本地檔案系統 MCP 工具及即時聯網搜尋。
      ambientRoommate:
        title: 氛圍室友
        tag: 主動陪伴日常
        description: 擁有生活起居習慣的伴侶。自然語音、環境心跳主動搭話、作息靜音時段與螢幕觀察能力。
      swissArmy:
        title: 全能旗艦
        tag: 步驟完整 · 應有盡有
        description: 旗艦級頂配體驗：語音雙向識別、視覺分析、桌面監控、主動感知、藝術創作、外部工具與四象限記憶。
      quiet:
        title: 靜默觀察者
        badge: ⚡ 極速 · 極簡主義
        subtitle: 文字、表情與記憶
        description: 零音訊開銷，具備舞台化身表情、思考節奏與長期記憶的輕量級文字夥伴。
      casual:
        title: 日常夥伴
        badge: ✨ 熱門之選
        subtitle: 語音對話與視覺感知
        description: 即時語音轉寫(STT)、情感語音合成(TTS)、聊天圖片感知、自然交流節奏與記憶。
      muse:
        title: 靈感繆斯
        badge: 🎨 視覺焦點
        subtitle: 語音、視覺與藝術創作
        description: 語音對話、圖像生成(Pollinations/ComfyUI)、圖片理解與豐富的化身變形。
      copilot:
        title: 高效副駕駛
        badge: 💼 生產力助手
        subtitle: 語音 + 行動工具
        description: 語音對話、桌面螢幕觀察、本機檔案系統 MCP 工具與即時網路搜尋。
      roommate:
        title: 日常室友
        badge: 🌙 主動陪伴
        subtitle: 生活作息與常駐存在
        description: 語音交流、環境心跳、就寢作息、免打擾時段與螢幕感知。
      swiss-army:
        title: 全能瑞士刀
        badge: 🔥 全功能 · 應有盡有
        subtitle: 全功能自主多模態
        description: 旗艦級全能數位夥伴。聽覺、神經語音、思考節奏、雙階段ACT表情、螢幕觀察、藝術生成與認知記憶層級。
