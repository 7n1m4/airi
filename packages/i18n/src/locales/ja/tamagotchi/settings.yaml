allow-visible-on-all-workspaces:
  title: すべてのワークスペースで表示
  description: ウィンドウをすべてのワークスペースで表示可能にします。macOSのみ。
pages:
  modules:
    mcp-server:
      description: MCPサーバーとツールの接続と管理
      title: MCPサーバー
      config-path: 設定ファイルのパス
      runtime-title: 実行中のサーバー
      tabs:
        manage: 管理
        store: ストア
        config: 設定
      actions:
        open-config: 設定を開く
        apply-restart: 適用して再起動
        refresh: 状態を更新
        install: インストール
      messages:
        opened: '{path} の設定ファイルを開きました'
        restarted: '再起動完了: 起動 {started} 件、失敗 {failed} 件、スキップ {skipped} 件。'
      guidance:
        title: ツールの使用方法
        note: 'MCPアクションを実行するには、AIに次のように伝えてください: 「mcp_tool_call 機能を使用して {tool}
          ツールを実行してください...」'
      dashboard:
        server-list: サーバーレジストリ
        no-servers: 設定されたサーバーはありません。
        tool-count: '{count} 個のツールが利用可能'
        details:
          command: コマンド
          args: 引数
          env: 環境変数
      store:
        title: MCP ストア
        description: 厳選されたMCPサーバーを見つけてインストール
        items:
          google-search:
            name: Google 検索
            description: Webグラウンディング用の公式Google検索MCPサーバー。
          filesystem:
            name: ファイルシステム
            description: ローカルファイルやディレクトリへの安全なアクセス。
          memory:
            name: メモリー
            description: 長期記憶の永続化のためのグラフベース記憶エンジン。
          postgres:
            name: PostgreSQL
            description: PostgreSQLデータベースへの読み書きアクセス。
  system:
    sections:
      section:
        window-shortcuts:
          title: キーボードショートカット
    window-shortcuts:
      description: ウィンドウ用ショートカットを変更します。
      title: ウィンドウショートカット
      toggle-move:
        label: 移動の切り替え
      toggle-resize:
        label: サイズ変更の切り替え
      toggle-ignore-mouse-event:
        label: マウスイベント無視の切り替え
      press-keys: 何かキーを押してください…
    developer:
      sections:
        section:
          use-window-mouse:
            title: useWindowMouse Tool
            description: Electronウィンドウのカーソル位置をテストします
    dock-mode:
      title: ウィンドウドックモード
      description: ウィンドウを他のアプリケーションウィンドウに吸着・ドッキングします。
devtools:
  title: 開発者
  pages:
    context-flow:
      title: コンテキストのフロー
    lag-visualizer:
      title: ラグビジュアライザー
    performance-visualizer:
      title: パフォーマンスビジュアライザー
      description: FPS/ロングタスク/メモリーオーバーレイの切り替え
    markdown-stress:
      title: Markdown ストレス
      description: 大量のチャットデータを含むMarkdownの解析とレンダリング負荷のテスト
    widgets-calling:
      title: ウィジェット呼び出し
screen-capture:
  permissions-prompt:
    title: 画面キャプチャ
    description: 画面またはウィンドウをキャプチャするには、画面とシステムのオーディオ録音の許可が必要です。
    open-preferences: システム設定を開く
    dismiss: 閉じる
    instructions:
      step-1: '「システム設定」を開き、サイドバーから「プライバシーとセキュリティ」を選択します。'
      step-2: '「画面&システム音声録音」および「システム音声録音のみ」のセクションで、AIRI用のスイッチをオンにしてください。'
      step-2-note: AIRIが表示されていない場合は、「+」ボタンをクリックして「アプリケーション」フォルダから「AIRI」を選択して手動で追加してください。
dock-mode:
  select-window: ターゲットウィンドウを選択
  refresh-windows: 更新
  no-windows: ウィンドウが見つかりません
