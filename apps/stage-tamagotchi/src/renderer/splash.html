<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>AIRI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      /* Base Theme Variables */
      .splash-card {
        --airi-ink: #27364b;
        --airi-title: #0f172a;
        --airi-muted: #586b82;
        --airi-edge: #d4e5ed;
        --airi-card-bg: rgba(255, 255, 255, 0.72);
        --airi-card-border: rgba(226, 232, 240, 0.85);
        --airi-track-bg: #e2e8f0;
        --airi-button-bg: #ffffffcc;
        --airi-button-border: #d4e5ed;
        --airi-badge-bg: #e0f2fe;
        --airi-badge-color: #0284c7;
        --airi-shadow: 45, 88, 122;
        --airi-bg: radial-gradient(ellipse at 12% 12%, #dcf7ff 0%, transparent 56%),
                   radial-gradient(ellipse at 90% 90%, #ece5ff 0%, transparent 55%), #f8fbff;

        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100vw;
        height: 100vh;
        border-radius: 24px;
        border: 1px solid var(--airi-edge);
        background: var(--airi-bg);
        color: var(--airi-ink);
        box-shadow: 0 20px 48px rgba(15, 23, 42, 0.08), 0 8px 24px rgba(148, 163, 184, 0.12);
        transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease, opacity 0.3s ease, transform 0.3s ease;
        -webkit-app-region: drag;
        overflow: hidden;
        isolation: isolate;
      }

      /* Dark Theme */
      .splash-card[data-theme="dark"] {
        --airi-ink: #e9f2ff;
        --airi-title: #f8fafc;
        --airi-muted: #a4b4cb;
        --airi-edge: #2c3a50;
        --airi-card-bg: rgba(24, 34, 50, 0.72);
        --airi-card-border: rgba(255, 255, 255, 0.08);
        --airi-track-bg: #273549;
        --airi-button-bg: #1c2a40;
        --airi-button-border: #2c3a50;
        --airi-badge-bg: rgba(2, 132, 199, 0.22);
        --airi-badge-color: #38bdf8;
        --airi-shadow: 0, 0, 0;
        --airi-bg: radial-gradient(ellipse at 12% 12%, #123647 0%, transparent 56%),
                   radial-gradient(ellipse at 90% 90%, #302947 0%, transparent 55%), #101823;
        color-scheme: dark;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.3);
      }

      .splash-card.exiting {
        opacity: 0;
        transform: scale(0.97);
      }

      /* Top Header Toolbar */
      .window-controls {
        -webkit-app-region: no-drag;
        position: absolute;
        top: 16px;
        left: 18px;
        display: flex;
        align-items: center;
        gap: 7px;
        z-index: 30;
      }

      .control-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 0.5px solid rgba(0, 0, 0, 0.12);
        cursor: pointer;
        transition: transform 0.15s ease, filter 0.15s ease;
      }

      .control-dot:hover {
        filter: brightness(0.92);
        transform: scale(1.08);
      }

      .control-dot.close {
        background: #ff5f56;
      }

      .control-dot.min {
        background: #ffbd2e;
      }

      .control-dot.max {
        background: #27c93f;
      }

      /* Theme Toggle Button */
      .theme-toggle-btn {
        -webkit-app-region: no-drag;
        position: absolute;
        top: 12px;
        right: 16px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 28px;
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid var(--airi-button-border);
        background: var(--airi-button-bg);
        color: var(--airi-ink);
        font-size: 11.5px;
        font-weight: 500;
        cursor: pointer;
        z-index: 30;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.15s ease;
      }

      .theme-toggle-btn:hover {
        transform: scale(1.04);
      }

      .theme-toggle-btn svg {
        width: 13px;
        height: 13px;
      }

      /* Atmospheric Sparkles */
      .sparkle {
        position: absolute;
        pointer-events: none;
        z-index: 5;
        animation: sparkle-float 3.4s ease-in-out infinite alternate;
      }

      .sparkle-tl {
        top: 60px;
        left: 68px;
        width: 16px;
        height: 16px;
        color: #7dd3fc;
      }

      .sparkle-tr {
        top: 64px;
        right: 68px;
        width: 16px;
        height: 16px;
        color: #c084fc;
        animation-delay: -1.2s;
      }

      .sparkle-bl {
        bottom: 120px;
        left: 48px;
        width: 14px;
        height: 14px;
        color: #f472b6;
        animation-delay: -2.1s;
      }

      .sparkle-br {
        bottom: 96px;
        right: 56px;
        width: 15px;
        height: 15px;
        color: #93c5fd;
        animation-delay: -0.7s;
      }

      @keyframes sparkle-float {
        0% {
          transform: scale(0.85) rotate(0deg);
          opacity: 0.55;
        }
        50% {
          transform: scale(1.15) rotate(90deg);
          opacity: 0.95;
        }
        100% {
          transform: scale(0.9) rotate(180deg);
          opacity: 0.6;
        }
      }

      /* Brand Area & Calm 4-Tile Loader */
      .brand-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 50px;
      }

      .airi-calm-loader {
        --airi-size: 92px;
        --airi-cycle: 6s;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: calc(var(--airi-size) * .065);
        width: var(--airi-size);
        aspect-ratio: 1;
        perspective: 650px;
        background: transparent;
      }

      .airi-calm-tile {
        --delay: 0s;
        position: relative;
        border-radius: 25%;
        background:
          radial-gradient(ellipse at 28% 12%, #ffffff80, transparent 68%),
          linear-gradient(145deg, var(--tile-top), var(--tile-bottom));
        box-shadow: inset 0 1px 2px #ffffff80,
                    inset 0 -3px 5px #3a6c8e16;
        transform-origin: 50% 70%;
        animation: airi-calm-lift var(--airi-cycle) cubic-bezier(.4, 0, .2, 1) infinite;
        animation-delay: var(--delay);
        will-change: transform;
      }

      .airi-calm-tile::before {
        content: "";
        position: absolute;
        inset: 5% 3% -2%;
        z-index: -1;
        border-radius: inherit;
        box-shadow: 0 6px 8px rgba(var(--airi-shadow, 45, 88, 122), .18);
        animation: airi-calm-shadow var(--airi-cycle) ease-in-out infinite;
        animation-delay: var(--delay);
      }

      /* Four Spans Clockwise (TL -> TR -> BR -> BL) */
      .airi-calm-tile:nth-child(1) { --tile-top: #c7f6fc; --tile-bottom: #a9dfeb; --delay: 0s; }
      .airi-calm-tile:nth-child(2) { --tile-top: #acf0fc; --tile-bottom: #81d7ee; --delay: 1.5s; }
      .airi-calm-tile:nth-child(3) { --tile-top: #b9d9ff; --tile-bottom: #91b9ed; --delay: 4.5s; }
      .airi-calm-tile:nth-child(4) { --tile-top: #ded1ff; --tile-bottom: #b8a6ef; --delay: 3s; }

      @keyframes airi-calm-lift {
        0%, 25%, 100% { transform: translateY(0) scale(1) rotateX(0) rotateZ(0); }
        10% { transform: translateY(-9%) scale(1.035) rotateX(-7deg) rotateZ(-1.5deg); }
      }

      @keyframes airi-calm-shadow {
        0%, 25%, 100% { opacity: .65; transform: translateY(0) scale(.98); }
        10% { opacity: .95; transform: translateY(6px) scale(1.03); }
      }

      @media (prefers-reduced-motion: reduce) {
        .airi-calm-tile,
        .airi-calm-tile::before { animation: none; will-change: auto; }
      }

      .app-title {
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 0.38em;
        color: var(--airi-title);
        margin-top: 14px;
        margin-left: 0.38em; /* optical centering */
        transition: color 0.3s ease;
      }

      /* Hero Section */
      .hero-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        margin-top: 18px;
        padding: 0 24px;
      }

      .hero-title {
        font-size: 21px;
        font-weight: 700;
        color: var(--airi-title);
        letter-spacing: -0.015em;
        line-height: 1.25;
        transition: color 0.3s ease;
      }

      .hero-subtitle {
        font-size: 13.5px;
        font-weight: 400;
        color: var(--airi-muted);
        margin-top: 6px;
        transition: color 0.3s ease;
      }

      /* Floating Milestone Progress Card */
      .milestone-card {
        -webkit-app-region: no-drag;
        width: 340px;
        border-radius: 18px;
        padding: 16px 18px;
        background: var(--airi-card-bg);
        border: 1px solid var(--airi-card-border);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
        margin-top: 22px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        transition: background 0.3s ease, border-color 0.3s ease;
      }

      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .card-info {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .icon-badge {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        border-radius: 12px;
        background: var(--airi-badge-bg);
        color: var(--airi-badge-color);
        flex-shrink: 0;
        transition: background 0.25s ease, color 0.25s ease;
      }

      .icon-badge svg {
        width: 22px;
        height: 22px;
      }

      .milestone-label {
        font-size: 14px;
        font-weight: 600;
        color: var(--airi-title);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 200px;
        transition: color 0.3s ease;
      }

      .progress-percent {
        font-size: 14px;
        font-weight: 500;
        color: var(--airi-muted);
        font-variant-numeric: tabular-nums;
        flex-shrink: 0;
        transition: color 0.3s ease;
      }

      .progress-track {
        width: 100%;
        height: 7px;
        border-radius: 9999px;
        background: var(--airi-track-bg);
        overflow: hidden;
        transition: background 0.3s ease;
      }

      .progress-bar {
        width: 0%;
        height: 100%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #38bdf8, #0ea5e9);
        transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .sub-hint {
        font-size: 12px;
        color: var(--airi-muted);
        font-weight: 400;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: color 0.3s ease;
      }

      /* Error Zone */
      .error-zone {
        display: none;
        flex-direction: column;
        gap: 10px;
        padding-top: 4px;
      }

      .error-zone.visible {
        display: flex;
      }

      .error-banner {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        border-radius: 10px;
        padding: 8px 10px;
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #991b1b;
        font-size: 12px;
      }

      .splash-card[data-theme="dark"] .error-banner {
        background: rgba(239, 68, 68, 0.15);
        border-color: rgba(239, 68, 68, 0.3);
        color: #fca5a5;
      }

      .error-banner svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        margin-top: 1px;
      }

      .error-details-box {
        max-height: 60px;
        overflow-y: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10.5px;
        color: #b91c1c;
        margin-top: 4px;
        word-break: break-word;
      }

      .splash-card[data-theme="dark"] .error-details-box {
        color: #f87171;
      }

      .btn-action-group {
        display: flex;
        gap: 8px;
        margin-top: 2px;
      }

      .btn-primary {
        flex: 1;
        padding: 7px 12px;
        font-size: 12px;
        font-weight: 500;
        border-radius: 8px;
        border: none;
        background: #0284c7;
        color: white;
        cursor: pointer;
        transition: background 0.15s ease;
      }

      .btn-primary:hover {
        background: #0369a1;
      }

      .btn-secondary {
        flex: 1;
        padding: 7px 12px;
        font-size: 12px;
        font-weight: 500;
        border-radius: 8px;
        border: 1px solid var(--airi-edge);
        background: var(--airi-button-bg);
        color: var(--airi-ink);
        cursor: pointer;
        transition: background 0.15s ease;
      }

      .btn-secondary:hover {
        filter: brightness(0.95);
      }

      /* While You Wait / Discoveries Section */
      .splash-discovery {
        -webkit-app-region: no-drag;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        width: 340px;
        min-height: 54px;
        margin-top: 18px;
        padding: 0 14px;
        transition: opacity 0.3s ease;
      }

      .discovery-header {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        margin-bottom: 6px;
        color: var(--airi-badge-color);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .discovery-icon {
        width: 11px;
        height: 11px;
        flex-shrink: 0;
      }

      .discovery-text {
        font-size: 12px;
        line-height: 1.45;
        color: var(--airi-muted);
        font-weight: 400;
        opacity: 1;
        transform: translateY(0);
        transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .discovery-text.fading {
        opacity: 0;
        transform: translateY(3px);
      }

      @media (prefers-reduced-motion: reduce) {
        .discovery-text {
          transform: none !important;
          transition: opacity 0.15s ease;
        }
      }

      /* Footer */
      .version-footer {
        margin-top: auto;
        margin-bottom: 18px;
        font-size: 11.5px;
        color: var(--airi-muted);
        letter-spacing: 0.02em;
        text-align: center;
        transition: color 0.3s ease;
      }
    </style>
  </head>
  <body>
    <div id="splash-card" class="splash-card" data-theme="light">
      <!-- Traffic Light Window Controls -->
      <div class="window-controls">
        <div id="btn-close-window" class="control-dot close" title="Close AIRI"></div>
        <div class="control-dot min"></div>
        <div class="control-dot max"></div>
      </div>

      <!-- Quick Theme Toggle for Testing Light/Dark Mode -->
      <button id="btn-theme-toggle" class="theme-toggle-btn" type="button" aria-label="Toggle theme">
        <svg id="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg id="theme-icon-sun" style="display: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <span id="theme-label">Dark</span>
      </button>

      <!-- Atmospheric Sparkles -->
      <svg class="sparkle sparkle-tl" viewBox="0 0 20 20" fill="currentColor">
        <path d="M 10 0 C 10 5.5, 14.5 10, 20 10 C 14.5 10, 10 14.5, 10 20 C 10 14.5, 5.5 10, 0 10 C 5.5 10, 10 5.5, 10 0 Z" />
      </svg>
      <svg class="sparkle sparkle-tr" viewBox="0 0 20 20" fill="currentColor">
        <path d="M 10 0 C 10 5.5, 14.5 10, 20 10 C 14.5 10, 10 14.5, 10 20 C 10 14.5, 5.5 10, 0 10 C 5.5 10, 10 5.5, 10 0 Z" />
      </svg>
      <svg class="sparkle sparkle-bl" viewBox="0 0 20 20" fill="currentColor">
        <path d="M 10 0 C 10 5.5, 14.5 10, 20 10 C 14.5 10, 10 14.5, 10 20 C 10 14.5, 5.5 10, 0 10 C 5.5 10, 10 5.5, 10 0 Z" />
      </svg>
      <svg class="sparkle sparkle-br" viewBox="0 0 20 20" fill="currentColor">
        <path d="M 10 0 C 10 5.5, 14.5 10, 20 10 C 14.5 10, 10 14.5, 10 20 C 10 14.5, 5.5 10, 0 10 C 5.5 10, 10 5.5, 10 0 Z" />
      </svg>

      <!-- Brand Area with Calm 4-Tile Animated Squares -->
      <div class="brand-section">
        <div class="airi-calm-loader" role="img" aria-label="Four pastel tiles gently lifting in a clockwise sequence">
          <span class="airi-calm-tile"></span>
          <span class="airi-calm-tile"></span>
          <span class="airi-calm-tile"></span>
          <span class="airi-calm-tile"></span>
        </div>
        <div class="app-title">A I R I</div>
      </div>

      <!-- Hero Heading -->
      <div class="hero-section">
        <h1 class="hero-title">Getting your companion ready</h1>
        <p class="hero-subtitle">A moment to settle in.</p>
      </div>

      <!-- Milestone Card -->
      <div class="milestone-card">
        <div class="card-header">
          <div class="card-info">
            <div id="icon-badge" class="icon-badge">
              <!-- Default Character User Icon -->
              <svg id="icon-current" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
            <div id="milestone-label" class="milestone-label">Loading your character</div>
          </div>
          <div id="progress-percent" class="progress-percent">0%</div>
        </div>

        <div class="progress-track">
          <div id="progress-bar" class="progress-bar"></div>
        </div>

        <div id="sub-hint" class="sub-hint">Preparing the stage</div>

        <!-- Error State Inside Card -->
        <div id="error-zone" class="error-zone">
          <div class="error-banner">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <div>
              <div id="error-msg" style="font-weight: 600;">Startup issue detected</div>
              <div id="error-details" class="error-details-box"></div>
            </div>
          </div>
          <div class="btn-action-group">
            <button id="btn-retry" class="btn-primary">Retry</button>
            <button id="btn-skip-avatar" class="btn-secondary" style="display: none;">Continue without avatar</button>
          </div>
        </div>
      </div>

      <!-- Discovery & While You Wait Section -->
      <div id="splash-discovery" class="splash-discovery" aria-live="polite">
        <div class="discovery-header">
          <svg class="discovery-icon" viewBox="0 0 20 20" fill="currentColor">
            <path d="M 10 0 C 10 5.5, 14.5 10, 20 10 C 14.5 10, 10 14.5, 10 20 C 10 14.5, 5.5 10, 0 10 C 5.5 10, 10 5.5, 10 0 Z" />
          </svg>
          <span class="discovery-label">While you wait</span>
        </div>
        <p id="discovery-text" class="discovery-text"></p>
      </div>

      <!-- Footer Version -->
      <div id="version-footer" class="version-footer">v0.9.38 · stable</div>
    </div>
    <script type="module" src="/splash.main.ts"></script>
  </body>
</html>
