# SPDX-License-Identifier: GPL-3.0-or-later

[package]
name = "stage-qt"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = [ "full" ] }
gltf = { version = "1", features = [ "extensions" ] }
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "time",
  "sync"
] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
anyhow = "1"

[build-dependencies]
cxx-qt-build = { version = "0.10", features = [ "link_qt_object_files" ] }
qt-build-utils = { version = "0.10" }
