[package]
name = "airi-qt"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
build = "build.rs"

[dependencies]
dirs = { workspace = true }
airi-store = { path = "../airi-store" }
airi-llm = { path = "../airi-llm" }
airi-core = { path = "../airi-core" }
airi-mcp = { path = "../airi-mcp" }
airi-channel = { path = "../airi-channel" }
airi-acp = { path = "../airi-acp" }
airi-sync = { path = "../airi-sync" }
airi-discord = { path = "../airi-discord" }
airi-i18n = { path = "../airi-i18n" }
airi-render = { path = "../airi-render" }
anyhow = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
cxx = { workspace = true }
cxx-qt = { workspace = true }
cxx-qt-lib = { workspace = true }
tray-item = { workspace = true }
global-hotkey = { workspace = true }
notify-rust = { workspace = true }
auto-launch = { workspace = true }
dbus = { workspace = true }
image = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
cxx-qt-build = { version = "0.10", features = [ "link_qt_object_files" ] }
qt-build-utils = { version = "0.10" }
