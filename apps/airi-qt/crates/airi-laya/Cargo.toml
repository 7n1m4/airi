[package]
name = "airi-laya"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "In-process ModernBERT decision-model runtime for the AIRI Laya System-1 path (ort + Hugging Face tokenizers, no Python)"

[dependencies]
dirs = { workspace = true }
futures-util = { workspace = true }
ort = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tokenizers = { workspace = true, features = [ "onig" ] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = [
  "macros",
  "rt-multi-thread"
] }
