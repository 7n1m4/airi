# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "anima-daemon"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Anima user-session awareness daemon (owns org.moeru.airi.Daemon1 on the session bus)"

[lib]
name = "anima_daemon"
path = "src/lib.rs"

[[bin]]
name = "anima-daemon"
path = "src/main.rs"

[dependencies]
dbus = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true, features = [ "derive" ] }
serde_json = { workspace = true }
anima-a11y = { path = "../anima-a11y" }
anima-channel = { path = "../anima-channel" }
anima-core = { path = "../anima-core", default-features = false }
anima-store = { path = "../anima-store" }

[dev-dependencies]
tempfile = { workspace = true }
anima-slint = { path = "../anima-slint" }
