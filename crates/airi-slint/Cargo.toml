# SPDX-License-Identifier: GPL-3.0-or-later

[package]
name = "airi-slint"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
build = "build.rs"

[lib]
name = "airi_slint"
path = "src/lib.rs"

[dependencies]
dirs = { workspace = true }
airi-store = { path = "../airi-store" }
airi-llm = { path = "../airi-llm" }
airi-core = { path = "../airi-core" }
airi-mcp = { path = "../airi-mcp" }
airi-channel = { path = "../airi-channel" }
airi-acp = { path = "../airi-acp" }
airi-sync = { path = "../airi-sync" }
airi-discord = { path = "../airi-discord" }
airi-i18n = { path = "../airi-i18n" }
airi-render = { path = "../airi-render" }
airi-mmd = { path = "../airi-mmd" }
airi-speech = { path = "../airi-speech" }
futures-util = { workspace = true }
anyhow = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { workspace = true }
slint = { workspace = true }
tray-item = { workspace = true }
global-hotkey = { workspace = true }
notify-rust = { workspace = true }
auto-launch = { workspace = true }
dbus = { workspace = true }
image = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
[dev-dependencies]
tempfile = { workspace = true }

[build-dependencies]
slint-build = "1"