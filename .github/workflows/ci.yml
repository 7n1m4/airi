name: 'CI: Monorepo Verification'

# Monorepo verification is heavy, so nightly runs cover the whole matrix; on
# push and pull request only the push/PR's own tree is verified.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run lint

  wire-types:
    name: Wire Types Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: ${{ runner.os }}-cargo-wire-types-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wire-types-
      # Regenerates and diffs the checked-in bindings; fails if crates/anima-channel/src/wire.rs
      # and packages/server-shared/src/types/generated/anima-channel.ts disagree (D2).
      - run: cargo run -p anima-channel --example export-wire-types --locked -- --check

  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    # The unified workspace build carries both rustls CryptoProviders; TLS tests
    # install aws-lc-rs explicitly (crates/anima-channel/src/lib.rs).
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug/deps
            target/debug/.fingerprint
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      - run: cargo test --workspace --locked

  build-test:
    name: Build Test (${{ matrix.app_name }})
    if: ${{ !(github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.label, 'moeru-ai:i18n/')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_name: stage-web
            command: pnpm -F @proj-anima/stage-web run build && pnpm -F @proj-anima/docs run build:base && mv ./docs/.vitepress/dist ./apps/stage-web/dist/docs && pnpm -F @proj-anima/stage-ui run story:build && mv ./packages/stage-ui/.histoire/dist ./apps/stage-web/dist/ui

          - app_name: stage-tamagotchi
            command: pnpm -F @proj-anima/stage-tamagotchi run build

          - app_name: ui-transitions
            command: pnpm -F @proj-anima/ui-transitions run play:build

          - app_name: ui-loading-screens
            command: pnpm -F @proj-anima/ui-loading-screens run play:build

    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v6

      # Turborepo
      - name: Cache turbo build setup
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts
      # stage-tamagotchi builds via Hutch: `pnpm run build` -> `hutch run build`,
      # which runs `hutch electrobun prepare` and `hutch electrobun build`. No
      # Electron binary download is needed (CEF is bundled by Electrobun).
      - run: pnpm run build:packages

      - name: Build App
        run: ${{ matrix.command }}

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    if: ${{ !(github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.label, 'moeru-ai:i18n/')) }}
    steps:
      - uses: actions/checkout@v6

      # Node.js
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts
      # NOTICE: typecheck resolves workspace subpath exports from dist/
      # (e.g. @proj-anima/plugin-protocol/types). --ignore-scripts skips the
      # implicit postinstall build, so build explicitly first.
      - run: pnpm run build:packages
      - run: pnpm run typecheck

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: ${{ !(github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.label, 'moeru-ai:i18n/')) }}
    steps:
      - uses: actions/checkout@v6

      # Node.js
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build:packages
      - run: pnpm test
      - run: pnpm run test:catalog:audit
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  check-provenance:
    name: Check Provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: danielroe/provenance-action@cbddd3d14144ca5c2f841d8e51bfb72675a55224 # main, pinned 2026-11-13
        id: check
        with:
          fail-on-provenance-change: true # optional, default: false
        #   lockfile: pnpm-lock.yaml      # optional
        #   base-ref: origin/main         # optional, default: origin/main
        #   fail-on-downgrade: true       # optional, default: true
      - name: Print result
        run: "echo 'Downgraded: ${{ steps.check.outputs.downgraded }}'"
