name: 'CI: Cross-WAN P2P (two runners)'

# Two GitHub-hosted runners that each boot a libp2p node (WebRTC + STUN) and
# try to find each other over the public internet.
#
# Rendezvous: a dedicated GitHub issue (#17) polled by the dialer. The listener
# writes its multiaddr as an issue comment; the dialer reads it and dials.
# Uses the default GITHUB_TOKEN (auto-provided) — no extra secrets needed.
#
# Honest limitation: GitHub-hosted runners sit behind Azure's symmetric NAT.
# WebRTC hole punching may fail even with STUN. The workflow reports success/
# failure via exit codes and uploads diagnostics as artifacts. A true reliable
# cross-WAN test requires a public relay (circuit relay v2), which is out of
# scope (needs hosted infra). mDNS/LAN discovery is exercised only in the
# in-process suite (pairing-trust-flow.test.ts).

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  listener:
    name: 'Node A (listener)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build node-datachannel native addon
        run: |
          cd node_modules/.pnpm/@ipshipyard+node-datachannel@*/node_modules/@ipshipyard/node-datachannel
          npx prebuild-install -r napi || npm run _prebuild
      - name: Boot listener and publish multiaddr
        env:
          CROSS_WAN_ROLE: listener
          CROSS_WAN_RENDEZVOUS_ISSUE: '17'
          CROSS_WAN_TIMEOUT_MS: '120000'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/cross-wan-node.mjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listener-diagnostics
          path: /tmp/cross-wan-diag.txt
          if-no-files-found: ignore

  dialer:
    name: 'Node B (dialer)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build node-datachannel native addon
        run: |
          cd node_modules/.pnpm/@ipshipyard+node-datachannel@*/node_modules/@ipshipyard/node-datachannel
          npx prebuild-install -r napi || npm run _prebuild
      - name: Dial listener and run gossipsub round-trip
        env:
          CROSS_WAN_ROLE: dialer
          CROSS_WAN_RENDEZVOUS_ISSUE: '17'
          CROSS_WAN_TIMEOUT_MS: '120000'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/cross-wan-node.mjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dialer-diagnostics
          path: /tmp/cross-wan-diag.txt
          if-no-files-found: ignore

  in-process:
    name: 'In-process P2P (localhost, real gossipsub)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build node-datachannel native addon
        run: |
          cd node_modules/.pnpm/@ipshipyard+node-datachannel@*/node_modules/@ipshipyard/node-datachannel
          npx prebuild-install -r napi || npm run _prebuild
      - name: Run libp2p P2P integration tests
        run: |
          pnpm -F @proj-airi/stage-tamagotchi exec vitest run \
            src/main/services/airi/libp2p/pairing-trust-flow.test.ts \
            src/main/services/airi/libp2p/transports.test.ts
