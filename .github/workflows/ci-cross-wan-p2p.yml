name: 'CI: Cross-WAN P2P (three runners)'

# Three GitHub-hosted runners that stand up a real libp2p mesh across the
# public internet.
#
# Every runner plays the same role: it boots a libp2p node behind a public
# tunnel, publishes its public WSS multiaddr to the rendezvous issue, and
# dials the other runners it finds there. Each runner sits behind Azure's
# symmetric NAT and can only dial out — the tunnel is what makes it reachable
# at all, because the tunnel's edge dials back in.
#
# Why not WebRTC/STUN: against a symmetric NAT, hole punching fails, so STUN
# buys nothing.
#
# Rendezvous: a dedicated GitHub issue (#17) used as a ledger. Each runner
# writes its WSS multiaddr as a marked issue comment; the others read it and
# dial. Uses the default GITHUB_TOKEN (auto-provided) — no extra secrets, no
# cloud account, no named tunnel.
#
# Tunnel backends, tried in order until one actually routes to the node:
#   cloudflared — an anonymous quick tunnel (trycloudflare.com).
#   pinggy      — a reverse tunnel through pinggy (*.free.pinggy.net).
#   ssh         — a reverse tunnel through localhost.run (*.lhr.life).
#
# The in-process job is the always-green backbone: real libp2p nodes and real
# gossipsub over loopback, with no network in the picture at all.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  peer-a:
    name: 'Peer A'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install cloudflared
        run: |
          curl -fsSL --retry 3 -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version
      - name: Join the mesh
        env:
          CROSS_WAN_ROLE: peer-a
          CROSS_WAN_CHANNEL: ci
          CROSS_WAN_RENDEZVOUS_ISSUE: '17'
          CROSS_WAN_TIMEOUT_MS: '300000'
          CROSS_WAN_EXPECTED_PEERS: '2'
          CROSS_WAN_ROUND_TRIP_TIMEOUT_MS: '150000'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/cross-wan-node.mjs

  peer-b:
    name: 'Peer B'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install cloudflared
        run: |
          curl -fsSL --retry 3 -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version
      - name: Join the mesh
        env:
          CROSS_WAN_ROLE: peer-b
          CROSS_WAN_CHANNEL: ci
          CROSS_WAN_RENDEZVOUS_ISSUE: '17'
          CROSS_WAN_TIMEOUT_MS: '300000'
          CROSS_WAN_EXPECTED_PEERS: '2'
          CROSS_WAN_ROUND_TRIP_TIMEOUT_MS: '150000'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/cross-wan-node.mjs

  peer-c:
    name: 'Peer C'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install cloudflared
        run: |
          curl -fsSL --retry 3 -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version
      - name: Join the mesh
        env:
          CROSS_WAN_ROLE: peer-c
          CROSS_WAN_CHANNEL: ci
          CROSS_WAN_RENDEZVOUS_ISSUE: '17'
          CROSS_WAN_TIMEOUT_MS: '300000'
          CROSS_WAN_EXPECTED_PEERS: '2'
          CROSS_WAN_ROUND_TRIP_TIMEOUT_MS: '150000'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/cross-wan-node.mjs

  in-process:
    name: 'In-process P2P (localhost, real gossipsub)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run libp2p P2P integration tests
        run: |
          pnpm -F @proj-airi/stage-tamagotchi exec vitest run \
            src/main/services/airi/libp2p/pairing-trust-flow.test.ts \
            src/main/services/airi/libp2p/transports.test.ts
