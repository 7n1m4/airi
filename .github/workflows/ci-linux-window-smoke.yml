name: 'CI: Linux Window Smoke'

# Compiling stage-tamagotchi on Linux (see the `build-test` job in ci.yml)
# only proves the code type-checks and bundles. It never launches the app,
# so regressions in the Electrobun/CEF runtime (chromiumFlags in
# electrobun.config.ts, the frameless transparent window config, CEF init
# under a headless display) have historically only surfaced when a
# contributor happened to run the app on their own Linux desktop. These jobs
# build and launch the real packaged app under a real (headless) display
# server and assert the main window renders.
#
# The runtime is Electrobun 2.0.6 with a bundled CEF (Chromium 156). Hutch
# resolves from ~/.hutch/bin (or the `electrobun` devDependency); the smoke
# script builds via `hutch electrobun build --env=stable`, unpacks the
# packaged `artifacts/stable-linux-x64-*.tar.zst`, and launches
# `<app>/bin/launcher` with `ELECTROBUN_CEF_REMOTE_DEBUGGING_PORT` pointing
# at a free port so CDP discovery is deterministic.
#
# Reproduce a failure locally with the same inputs the job records in
# report.json (artifact `linux-window-render-smoke-*`):
#
#   pnpm install --frozen-lockfile && pnpm run build:packages
#   SMOKE_EXPECT_SESSION_TYPE=x11 \
#     xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
#     pnpm -F @proj-airi/stage-tamagotchi run smoke:linux-window-render

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Wayland coverage runs nightly rather than per-PR: it depends on a
    # nested compositor (weston) that is not representative of a real user
    # compositor and adds CI flakiness risk disproportionate to how often
    # the Wayland-only branch actually changes.
    - cron: '0 18 * * *'

# A newer push to the same PR supersedes the running smoke; main and
# scheduled runs are keyed by run id so they never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # Fixed locale and timezone so renderer output, logs, and screenshots do
  # not depend on the runner image defaults.
  LANG: C.UTF-8
  TZ: UTC
  # Electrobun's Linux CEF defaults already append `no-sandbox` (see
  # ElectrobunApp::OnBeforeCommandLineProcessing in electrobun's
  # nativeWrapper.cpp), so CI's missing setuid chrome-sandbox helper is a
  # non-issue and nothing here needs ELECTRON_DISABLE_SANDBOX.
  # Non-hidden on purpose: actions/upload-artifact skips hidden paths such
  # as `.temp/`, which left earlier failed runs without any artifact.
  SMOKE_REPORT_DIR: ${{ github.workspace }}/smoke-report

jobs:
  x11-window-render:
    name: X11 window render (Xvfb)
    if: ${{ !(github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.label, 'moeru-ai:i18n/')) }}
    # Pinned instead of ubuntu-latest: the apt package names below
    # (libasound2t64) and the Xvfb/Mesa versions are image-specific.
    runs-on: ubuntu-24.04
    # Each launch phase has its own 60-120s budget inside the script; this
    # only stops a wedged display server or install from holding a runner
    # for the 6h default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Cache turbo build setup
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # Same Node.js pin as ci.yml; see the NOTICE there for why it is pinned.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 26.7.0
          cache: pnpm

      # CEF's own runtime deps (the `NEEDED` set of the bundled
      # libcef.so: libnss3/libnspr4, libatk-1.0-0, libatk-bridge2.0-0,
      # libcups2, libdrm2, libgbm1, libxkbcommon0, libxcomposite1,
      # libxdamage1, libxfixes3, libxrandr2, libpango-1.0-0, libcairo2,
      # libasound2, libatspi2.0-0, libx11-xcb1) plus GTK 3 (Electrobun's
      # native wrapper links libgtk-3.so.0) and Xvfb.
      - name: Install Xvfb and CEF system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            xauth \
            libgtk-3-0 \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libgbm1 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libpango-1.0-0 \
            libcairo2 \
            libasound2t64 \
            libatspi2.0-0 \
            libx11-xcb1

      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Resolves the Hutch toolchain (the `electrobun` devDependency's bin
      # forwards to a cached Hutch under ~/.hutch) before any hutch call.
      - name: Provision Electrobun toolchain
        working-directory: ./apps/stage-tamagotchi
        run: hutch electrobun prepare

      - run: pnpm run build:packages
      - run: pnpm -F @proj-airi/stage-tamagotchi run build

      - name: Record toolchain versions
        run: |
          mkdir -p "${SMOKE_REPORT_DIR}"
          {
            echo "runner: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "node: $(node --version)"
            echo "pnpm: $(pnpm --version)"
            echo "electrobun: $(node -p "require('./apps/stage-tamagotchi/node_modules/electrobun/package.json').version")"
            echo "hutch: $(hutch --version 2>&1)"
            dpkg-query -W -f='${Package} ${Version}\n' xvfb libgtk-3-0 libnss3 libgbm1 libdrm2 libasound2t64 mesa-libgallium 2>/dev/null || true
          } | tee "${SMOKE_REPORT_DIR}/toolchain.txt"

      - name: Run window-render smoke under Xvfb
        env:
          SMOKE_EXPECT_SESSION_TYPE: x11
        # Pin the screen instead of relying on the xvfb-run/Xvfb default,
        # which differs across releases. The transparent frameless main
        # window needs a 24-bit visual, and a fixed size keeps window
        # placement and screenshots comparable between runs.
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24 -nolisten tcp" \
            pnpm -F @proj-airi/stage-tamagotchi run smoke:linux-window-render

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-window-render-smoke-x11
          path: |
            ${{ env.SMOKE_REPORT_DIR }}/*
            !${{ env.SMOKE_REPORT_DIR }}/stage-user-data/**
            !${{ env.SMOKE_REPORT_DIR }}/app/**
            !${{ env.SMOKE_REPORT_DIR }}/xdg-*/**
          if-no-files-found: warn
          retention-days: 14

  wayland-window-render:
    name: Wayland window render (weston headless)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Cache turbo build setup
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 26.7.0
          cache: pnpm

      # Same CEF runtime set as the X11 job, plus weston for the headless
      # Wayland compositor.
      - name: Install Weston and CEF system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            weston \
            libgtk-3-0 \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libgbm1 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libpango-1.0-0 \
            libcairo2 \
            libasound2t64 \
            libatspi2.0-0 \
            libx11-xcb1

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Provision Electrobun toolchain
        working-directory: ./apps/stage-tamagotchi
        run: hutch electrobun prepare

      - run: pnpm run build:packages
      - run: pnpm -F @proj-airi/stage-tamagotchi run build

      - name: Record toolchain versions
        run: |
          mkdir -p "${SMOKE_REPORT_DIR}"
          {
            echo "runner: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "node: $(node --version)"
            echo "pnpm: $(pnpm --version)"
            echo "electrobun: $(node -p "require('./apps/stage-tamagotchi/node_modules/electrobun/package.json').version")"
            echo "hutch: $(hutch --version 2>&1)"
            echo "weston: $(weston --version 2>&1)"
            dpkg-query -W -f='${Package} ${Version}\n' weston libgtk-3-0 libnss3 libgbm1 libdrm2 libasound2t64 mesa-libgallium 2>/dev/null || true
          } | tee "${SMOKE_REPORT_DIR}/toolchain.txt"

      - name: Start headless Weston compositor
        run: |
          export XDG_RUNTIME_DIR="${RUNNER_TEMP}/xdg-runtime"
          mkdir -p "${XDG_RUNTIME_DIR}"
          chmod 0700 "${XDG_RUNTIME_DIR}"
          echo "XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}" >> "$GITHUB_ENV"

          # Fixed output size for the same reason as the Xvfb screen: the
          # main window must fit, and screenshots stay comparable.
          weston --backend=headless-backend.so --socket=wayland-1 --idle-time=0 \
            --width=1920 --height=1080 \
            --log="${SMOKE_REPORT_DIR}/weston.log" &
          WESTON_PID=$!
          echo "WESTON_PID=${WESTON_PID}" >> "$GITHUB_ENV"

          for _ in $(seq 1 50); do
            [ -S "${XDG_RUNTIME_DIR}/wayland-1" ] && exit 0
            if ! kill -0 "${WESTON_PID}" 2>/dev/null; then
              echo "weston exited before creating its wayland-1 socket" >&2
              cat "${SMOKE_REPORT_DIR}/weston.log" >&2 || true
              exit 1
            fi
            sleep 0.2
          done
          echo "weston did not create its wayland-1 socket in time" >&2
          exit 1

      - name: Run window-render smoke against the Wayland session
        env:
          XDG_SESSION_TYPE: wayland
          WAYLAND_DISPLAY: wayland-1
          SMOKE_EXPECT_SESSION_TYPE: wayland
        # No DISPLAY is set, so the app cannot fall back to X11; the smoke
        # asserts the session type it actually ran in matches.
        run: |
          unset DISPLAY
          pnpm -F @proj-airi/stage-tamagotchi run smoke:linux-window-render

      - name: Stop Weston
        if: always()
        run: kill "${WESTON_PID}" 2>/dev/null || true

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-window-render-smoke-wayland
          path: |
            ${{ env.SMOKE_REPORT_DIR }}/*
            !${{ env.SMOKE_REPORT_DIR }}/stage-user-data/**
            !${{ env.SMOKE_REPORT_DIR }}/app/**
            !${{ env.SMOKE_REPORT_DIR }}/xdg-*/**
          if-no-files-found: warn
          retention-days: 14
