name: 'Wire Fixture Conformance'

# Three-job conformance CI for the anima-channel wire protocol (airi-wxp.2.8):
#   - Rust:  golden fixtures round-trip through anima-channel wire types
#   - Dart:  golden fixtures parse through the Dart wire codec (ServerFrame,
#            GatewayEventFrame, CoreStatus, RpcError)
#   - C#:    golden fixtures decode through the C# EventPayloadDecoder
#
# All three jobs read the same golden JSON fixtures under
#   crates/anima-channel/fixtures/golden/
# which are regenerated by:
#   cargo run -p anima-channel --example export-golden-fixtures
#
# The jobs run on every push/PR to main and nightly.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  rust-conformance:
    name: 'Rust: Golden Fixtures'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug/deps
            target/debug/.fingerprint
          key: ${{ runner.os }}-cargo-conformance-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-conformance-
      # 1) Regenerate fixtures and verify they are not stale.
      - name: Check golden fixtures are up to date
        run: cargo run -p anima-channel --example export-golden-fixtures --locked -- --check
      # 2) Run the Rust conformance test suite (round-trip through wire types).
      - name: Run Rust conformance tests
        run: cargo test -p anima-channel --locked golden_fixtures

  dart-conformance:
    name: 'Dart: Golden Fixtures'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install Flutter dependencies
        working-directory: apps/flutter
        run: flutter pub get
      - name: Run Dart conformance tests
        working-directory: apps/flutter
        run: flutter test test/golden_fixtures_test.dart

  csharp-conformance:
    name: 'C#: Golden Fixtures'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run C# conformance tests
        working-directory: crates/anima-channel/conformance-tests
        run: dotnet test
