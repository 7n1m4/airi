name: 'CI: Keyless Providers Smoke'
on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/stage-ui/src/libs/providers/**'
      - 'scripts/test-keyless-providers.mjs'
      - '.github/workflows/ci-keyless-providers.yml'

jobs:
  smoke:
    name: Keyless Provider Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec tsx scripts/test-keyless-providers.ts

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keyless-providers-report
          path: keyless-providers-report.json